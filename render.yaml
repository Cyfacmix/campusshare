databases:
  - name: campusshare-db
    plan: free
    region: frankfurt
    databaseName: campusshare
    user: campusshare

services:
  - type: web
    name: campusshare-api
    runtime: python
    plan: free
    region: frankfurt
    rootDir: backend
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --no-input && python manage.py migrate --no-input && (python manage.py createsuperuser --no-input || true)
    startCommand: gunicorn config.wsgi:application
    healthCheckPath: /api/v1/filieres/
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.8"
      - key: DATABASE_URL
        fromDatabase:
          name: campusshare-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: DJANGO_SUPERUSER_EMAIL
        sync: false
      - key: DJANGO_SUPERUSER_PASSWORD
        sync: false
      - key: S3_BUCKET
        sync: false
      - key: S3_ENDPOINT_URL
        sync: false
      - key: S3_ACCESS_KEY
        sync: false
      - key: S3_SECRET_KEY
        sync: false
      - key: S3_REGION
        sync: false
      - key: S3_PUBLIC_DOMAIN
        sync: false
      - key: AWS_REQUEST_CHECKSUM_CALCULATION
        value: when_required
      - key: AWS_RESPONSE_CHECKSUM_VALIDATION
        value: when_required

  - type: web
    name: campusshare-web
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html